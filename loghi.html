<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSM — Proposte logo</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .loghi-page { padding: calc(var(--header) + 2rem) 0 4rem; }
    .loghi-page h1 { margin-bottom: 1.5rem; }
    .loghi-grid { display: grid; gap: 1.2rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .loghi-grid figure { margin: 0; background: #07060c; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    .loghi-grid img { width: 100%; height: auto; display: block; }
    .loghi-grid figcaption { padding: 0.9rem 1rem 1.1rem; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="loghi-page container">
    <h1 class="section-title">Proposte logo</h1>
    <div class="loghi-grid">
      <figure>
        <img src="images/loghi/01-couture-cyan.jpg" alt="Logo 1 Couture cyan">
        <figcaption>1 — Couture cyan</figcaption>
      </figure>
      <figure>
        <img src="images/loghi/02-grotesk.jpg" alt="Logo 2 Grotesk">
        <figcaption>2 — Grotesk</figcaption>
      </figure>
      <figure>
        <img src="images/loghi/03-neon-line.jpg" alt="Logo 3 Neon line">
        <figcaption>3 — Neon line</figcaption>
      </figure>
      <figure>
        <img src="images/loghi/04-app-icon.jpg" alt="Logo 4 App icon">
        <figcaption>4 — App icon</figcaption>
      </figure>
      <figure>
        <img src="images/loghi/05-wordmark.jpg" alt="Logo 5 Wordmark">
        <figcaption>5 — Wordmark</figcaption>
      </figure>
      <figure>
        <img src="images/loghi/06-orb.jpg" alt="Logo 6 Orb">
        <figcaption>6 — Orb</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
