<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TSM - Tecnologia su Misura. Boutique di software, siti web e automazioni ultra personalizzate per Professionisti, Micro-Imprese e PMI.">
  <title>TSM — Tecnologia su Misura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <header class="header" id="header">
    <div class="container header-inner">
      <a href="#hero" class="logo-link" aria-label="TSM Home">
        <picture>
          <source srcset="tsm-logo.webp" type="image/webp">
          <img src="tsm-logo.jpg" alt="TSM Logo" class="logo-img" width="367" height="480">
        </picture>
        <span class="logo-text">TSM</span>
      </a>
      <nav class="nav" id="nav">
        <ul class="nav-list">
          <li><a href="#filosofia" class="nav-link">Filosofia</a></li>
          <li><a href="#servizi" class="nav-link">Servizi</a></li>
          <li><a href="#metodo" class="nav-link">Metodo</a></li>
          <li><a href="#per-chi" class="nav-link">Per chi</a></li>
          <li><a href="#pricing" class="nav-link">Prezzi</a></li>
          <li><a href="#contatti" class="nav-link">Contatti</a></li>
        </ul>
      </nav>
      <button class="menu-toggle" id="menu-toggle" aria-label="Apri menu" aria-expanded="false">
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
      </button>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="container hero-content">
      <div class="hero-logo-wrap">
        <picture>
          <source srcset="tsm-logo.webp" type="image/webp">
          <img src="tsm-logo.jpg" alt="TSM — Tecnologia su Misura" class="hero-logo" width="367" height="480">
        </picture>
      </div>
      <h1 class="hero-title">
        <span class="hero-title-main">Tecnologia</span>
        <span class="hero-title-sub">su Misura</span>
      </h1>
      <p class="hero-tagline">
        Boutique di Software, Automazioni e Siti Web<br>
        ultra personalizzati
      </p>
      <p class="hero-audience">
        Per Professionisti · Micro-Imprese · PMI
      </p>
    </div>

  </section>
